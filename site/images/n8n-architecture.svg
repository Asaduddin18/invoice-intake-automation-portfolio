<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">Local n8n and invoice application architecture</title><desc id="desc">An operator triggers n8n. Authenticated API requests reach Python, which retains financial rules and provider connections. Safe summaries return to n8n. Optional schedules are disabled.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#226455"/></marker></defs><rect width="1000" height="370" rx="16" fill="#f3f7f5"/><g fill="#fff" stroke="#c5d5ce" stroke-width="2"><rect x="25" y="115" width="155" height="110" rx="12"/><rect x="230" y="75" width="235" height="190" rx="12"/><rect x="535" y="75" width="230" height="190" rx="12"/><rect x="820" y="30" width="155" height="70" rx="10"/><rect x="820" y="150" width="155" height="70" rx="10"/><rect x="820" y="270" width="155" height="70" rx="10"/></g><g font-family="system-ui,sans-serif" fill="#142b35" text-anchor="middle"><text x="102" y="157" font-size="19" font-weight="700">Operator</text><text x="102" y="187" font-size="15">Manual start</text><text x="348" y="114" font-size="21" font-weight="700">n8n</text><text x="348" y="148" font-size="15">Intake / monthly reporting</text><text x="348" y="180" font-size="15">Failure summaries</text><text x="348" y="224" font-size="14" fill="#9b681b">Schedules disabled</text><text x="650" y="113" font-size="21" font-weight="700">Python / FastAPI</text><text x="650" y="148" font-size="15">Validation + review policy</text><text x="650" y="180" font-size="15">Duplicate-safe draft bills</text><text x="650" y="224" font-size="14">Saved state + provider access</text><text x="897" y="72" font-size="18">Gmail</text><text x="897" y="192" font-size="18">Xero drafts</text><text x="897" y="312" font-size="18">Sheets reports</text><text x="500" y="51" font-size="13">Authenticated operation API</text><text x="500" y="305" font-size="13">Safe operational summaries</text><text x="500" y="347" font-size="14" fill="#5c7279">DeepSeek is called by Python only when uncached extraction is explicitly allowed.</text></g><g fill="none" stroke="#226455" stroke-width="2" marker-end="url(#arrow)"><path d="M180 170 H225"/><path d="M465 120 H530"/><path d="M535 245 H470"/><path d="M765 125 H790 V65 H815"/><path d="M765 185 H815"/><path d="M765 235 H790 V305 H815"/></g></svg>
